<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DepPy Playground</title>
  <link rel="stylesheet" href="./style.css?v=4">
  <script type="importmap">
  {
    "imports": {
      "@codemirror/lang-python": "https://ga.jspm.io/npm:@codemirror/lang-python@6.2.1/dist/index.js",
      "codemirror": "https://ga.jspm.io/npm:codemirror@6.0.2/dist/index.js"
    },
    "scopes": {
      "https://ga.jspm.io/": {
        "@codemirror/autocomplete": "https://ga.jspm.io/npm:@codemirror/autocomplete@6.20.3/dist/index.js",
        "@codemirror/commands": "https://ga.jspm.io/npm:@codemirror/commands@6.11.1/dist/index.js",
        "@codemirror/language": "https://ga.jspm.io/npm:@codemirror/language@6.12.4/dist/index.js",
        "@codemirror/lint": "https://ga.jspm.io/npm:@codemirror/lint@6.9.7/dist/index.js",
        "@codemirror/search": "https://ga.jspm.io/npm:@codemirror/search@6.7.2/dist/index.js",
        "@codemirror/state": "https://ga.jspm.io/npm:@codemirror/state@6.7.6/dist/index.js",
        "@codemirror/view": "https://ga.jspm.io/npm:@codemirror/view@6.43.13/dist/index.js",
        "@lezer/common": "https://ga.jspm.io/npm:@lezer/common@1.5.3/dist/index.js",
        "@lezer/highlight": "https://ga.jspm.io/npm:@lezer/highlight@1.2.4/dist/index.js",
        "@lezer/lr": "https://ga.jspm.io/npm:@lezer/lr@1.4.10/dist/index.js",
        "@lezer/python": "https://ga.jspm.io/npm:@lezer/python@1.1.19/dist/index.js",
        "@marijn/find-cluster-break": "https://ga.jspm.io/npm:@marijn/find-cluster-break@1.0.3/src/index.js",
        "crelt": "https://ga.jspm.io/npm:crelt@1.0.7/index.js",
        "style-mod": "https://ga.jspm.io/npm:style-mod@4.1.4/src/style-mod.js",
        "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js"
      }
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">λ</span> DepPy</div>
    <div class="header-links">
      <span class="header-note">Runs in your browser</span>
      <a class="github-link" href="https://github.com/45deg/DepPy" target="_blank" rel="noopener noreferrer" aria-label="DepPy on GitHub (opens in a new tab)">
        <img src="./github-invertocat-black.svg" alt="" width="24" height="24">
      </a>
    </div>
  </header>
  <main>
    <div class="intro">
      <h1>Playground</h1>
      <p>Edit Python. Check types and proofs.</p>
    </div>
    <div class="workspace">
      <section class="panel editor-panel" aria-labelledby="editor-title">
        <div class="panel-head">
          <h2 id="editor-title">Code</h2>
          <label class="example-picker">Example
            <select id="examples" aria-label="Example"><option value="">Loading…</option></select>
          </label>
        </div>
        <div class="editor-wrap" id="editor-wrap">
          <div id="fallback-editor" class="fallback-editor">
            <div id="line-numbers" class="line-numbers" aria-hidden="true">1</div>
            <textarea id="source" wrap="soft" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="DepPy code"></textarea>
          </div>
          <div id="cm-editor" aria-label="DepPy code editor"></div>
        </div>
        <div class="panel-foot">
          <span id="source-meta">0 lines</span>
          <div class="actions"><span class="shortcut">⌘ / Ctrl + Enter</span><button id="check" type="button">Check</button></div>
        </div>
      </section>
      <section class="panel result-panel" aria-labelledby="result-title">
        <div class="panel-head"><h2 id="result-title">Results</h2><span id="status" class="status idle">Ready</span></div>
        <div id="results" class="results" aria-live="polite"><div class="empty-state">Run a check to see results.</div></div>
        <div class="panel-foot result-foot">Kernel terms use DepPy’s internal notation.</div>
      </section>
    </div>
  </main>
</body>
</html>
