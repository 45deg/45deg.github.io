<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alloy Analyzer WASM (unofficial)</title>
<link rel="stylesheet" href="style.min.css">
<script type="module" src="app.bundle.js"></script>
</head>
<body>
<main class="ide">
<nav class="menu" aria-label="Application menu" data-i18n-label="menu">
  <h1>Alloy Analyzer WASM (unofficial)</h1>
  <div class="menu-actions"><button id="language" type="button" lang="ja">日本語</button>
  <a href="licenses.html" target="_blank" rel="noopener" data-i18n="licenses">Licenses</a></div>
</nav>
<section class="toolbar" aria-label="Samples and analysis" data-i18n-label="controls">
  <div class="controls">
    <label for="sample" data-i18n="sample">Sample</label>
    <select id="sample" disabled><option value="" data-i18n="loading">Loading…</option></select>
    <button id="load" disabled data-i18n="load">Load</button>
    <button id="run" data-i18n="run">Analyze</button>
    <button id="cancel" disabled data-i18n="cancel">Stop</button>
  </div>
</section>
<div id="workspace" class="workspace">
  <section id="editor-pane" class="pane" aria-labelledby="editor-title">
    <header class="pane-header"><h2 id="editor-title" data-i18n="model">Alloy model</h2><span id="document-name">untitled.als</span></header>
    <div id="source" class="editor-host"></div>
    <footer class="pane-footer" id="cursor">Line 1 · Column 1</footer>
  </section>
  <div id="splitter" role="separator" tabindex="0" aria-label="Resize editor and results" data-i18n-label="splitter" aria-orientation="vertical" aria-controls="editor-pane result-pane" aria-valuemin="20" aria-valuemax="80" aria-valuenow="55"></div>
  <section id="result-pane" class="pane" aria-labelledby="result-title">
    <header class="pane-header"><h2 id="result-title" data-i18n="result">Analysis results</h2></header>
    <div class="result-scroll" tabindex="0" aria-label="Scrollable analysis results" data-i18n-label="resultScroll"><div id="result" data-i18n="notRun">No analysis yet.</div></div>
    <footer class="pane-footer" id="status" role="status" aria-live="polite" data-i18n="idle">Ready</footer>
  </section>
</div>
</main>
</body>
</html>
