    <meta name="application-name" content="Morf" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="styles.css" />
  </head>

    <header class="container">
      <div>
        <h1>Morf</h1>
        <p data-i18n="tagline">補正したい範囲をポイントで囲むと、傾きやゆがみを整えて正面向きの画像にします。</p>
      </div>
      <label class="file-button">
        <svg class="icon" aria-hidden="true"><use href="#fa-folder-open" /></svg>
        <span data-i18n="openImage">画像を開く</span>
        <input id="file-input" type="file" accept="image/*" />
      </label>
    </header>

    <main class="container">
      <section id="workspace" class="workspace" data-mobile-view="input" aria-label="射影変換ワークスペース" data-i18n-aria-label="workspace.label">
        <div class="view-switch" role="group" aria-label="表示するキャンバス" data-i18n-aria-label="view.label">
          <button class="secondary view-button" type="button" data-view="input" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#fa-image" /></svg><span data-i18n="view.input">入力</span></button>
          <button class="secondary view-button" type="button" data-view="output" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#fa-wand-magic-sparkles" /></svg><span data-i18n="view.output">出力</span></button>
          <button class="secondary view-button" type="button" data-view="both" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#fa-table-columns" /></svg><span data-i18n="view.both">両方</span></button>
        </div>
        <article class="input-panel">
          <div class="panel-heading">
            <div>
              <h2 data-i18n="view.input">入力</h2>
              <p id="input-instruction" data-i18n="instruction.drag">点をドラッグして範囲を合わせます</p>
            </div>
            <div class="panel-actions">
              <span id="point-badge" class="badge" data-i18n="points.4">4点</span>
              <button id="focus-edit-button" class="secondary compact mobile-only" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#fa-expand" /></svg><span data-button-label data-i18n="focus.expand">拡大編集</span></button>
            </div>
          </div>
          <div id="input-stage" class="canvas-shell drop-zone">
            <canvas id="input-canvas" tabindex="0" aria-describedby="canvas-help" aria-label="変換元画像。コントロールポイントをドラッグして範囲と歪みを指定できます" data-i18n-aria-label="canvas.inputLabel"></canvas>
            <div class="drop-message" data-i18n="canvas.drop">画像をここにドロップ</div>
          </div>
          <p id="canvas-help" class="sr-only" data-i18n="canvas.help">ポイントをタップして選択できます。選択後は矢印キーでも移動できます。</p>
        </article>

        <article class="output-panel">
          <div class="panel-heading">
            <div>
              <h2 data-i18n="view.output">出力</h2>
              <p id="output-size" aria-live="polite">—</p>
            </div>
            <button id="export-button" class="secondary compact" type="button"><svg class="icon" aria-hidden="true"><use href="#fa-download" /></svg><span data-i18n="export.png">PNGで保存</span></button>
          </div>
          <div class="canvas-shell result-shell">
            <canvas id="output-canvas" aria-label="射影変換後の画像" data-i18n-aria-label="canvas.outputLabel"></canvas>
            <div id="rendering" class="rendering" hidden data-i18n="rendering">処理中…</div>
          </div>
        </article>
      </section>

      <section class="controls" aria-label="変換オプション" data-i18n-aria-label="controls.label">
        <div class="control-group">
          <label for="aspect" data-i18n="aspect.label">アスペクト比</label>
          <select id="aspect">
            <option value="auto" selected data-i18n="aspect.auto">自動（選択範囲から推定）</option>
            <option value="1">1:1</option>
            <option value="1.333333">4:3</option>
            <option value="1.5">3:2</option>
            <option value="1.777778">16:9</option>
            <option value="custom" data-i18n="aspect.custom">カスタム</option>
          </select>
        </div>
        <div id="custom-aspect" class="control-group custom-aspect" hidden>
          <label for="custom-width" data-i18n="aspect.ratio">幅 : 高さ</label>
          <div class="ratio-fields">
            <input id="custom-width" type="number" min="1" max="100" value="4" aria-label="比率の幅" data-i18n-aria-label="aspect.width" />
            <span>:</span>
            <input id="custom-height" type="number" min="1" max="100" value="3" aria-label="比率の高さ" data-i18n-aria-label="aspect.height" />
          </div>
        </div>
        <div class="control-group">
          <label for="sampling" data-i18n="sampling.label">サンプリング</label>
          <select id="sampling">
            <option value="bilinear">Bilinear</option>
            <option value="nearest">Nearest</option>
            <option value="bicubic">Bicubic</option>
            <option value="lanczos">Lanczos</option>
          </select>
        </div>
        <div class="control-group">
          <label for="mesh-size" data-i18n="mesh.label">コントロールポイント</label>
          <select id="mesh-size">
            <option value="2" data-i18n="mesh.4">4点（2 × 2）</option>
            <option value="3" data-i18n="mesh.9">9点（3 × 3）</option>
            <option value="4" data-i18n="mesh.16">16点（4 × 4）</option>
            <option value="5" data-i18n="mesh.25">25点（5 × 5）</option>
          </select>
        </div>
        <div class="control-group">
          <label for="edge-snap" data-i18n="edge.label">エッジスナップ</label>
          <select id="edge-snap">
            <option value="none" data-i18n="edge.none">なし</option>
            <option value="low" data-i18n="edge.low">低</option>
            <option value="medium" data-i18n="edge.medium">中</option>
            <option value="high" data-i18n="edge.high">高</option>
          </select>
        </div>
        <div class="button-group">
          <button id="undo-button" class="secondary" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#fa-rotate-left" /></svg><span data-i18n="undo">元に戻す</span></button>
          <button id="rotate-button" class="secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#fa-rotate" /></svg><span data-i18n="rotate">点を回転</span></button>
          <button id="reset-button" class="secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#fa-eraser" /></svg><span data-i18n="reset">リセット</span></button>
        </div>
      </section>
      <p class="hint" data-i18n="privacy">画像はブラウザ内だけで処理され、外部へ送信されません。</p>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/edge-snap.js"></script>
    <script src="js/input-canvas.js"></script>
    <script src="js/demo-image.js"></script>
    <script src="app-worker.js"></script>
    <script src="app.js"></script>
  </body>
</html>
