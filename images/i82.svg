<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">KaTeX formula converted to standalone .svg with WOFF2</title>
  <desc id="desc">Editorial diagram converting math expression ∑ x² into a standalone .svg via WOFF2 font subsetting.</desc>
  <rect width="512" height="320" fill="#faf5eb"/>

  <!-- Faint typographic baseline rules -->
  <g stroke="#e7e5e4" stroke-width="2">
    <path d="M0 64h512M0 112h512M0 212h512M0 276h512"/>
  </g>

  <!-- Top: Math specimen frame -->
  <rect x="168" y="24" width="176" height="94" rx="8" fill="#ffffff" stroke="#1c1917" stroke-width="4"/>
  <rect x="176" y="32" width="44" height="22" rx="4" fill="#db2777"/>
  <text x="198" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">TeX</text>
  <text x="256" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#1c1917" text-anchor="middle">∑ x²</text>

  <!-- Middle: WOFF2 + Arrow -->
  <path d="M256 122v64m-9-9 9 10 9-10" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="210" y="136" width="92" height="28" rx="14" fill="#db2777"/>
  <text x="256" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">WOFF2</text>

  <!-- Bottom: Dark ink .svg frame with corner vector handles -->
  <rect x="176" y="196" width="160" height="96" rx="4" fill="#1c1917" stroke="#db2777" stroke-width="3.5"/>
  <rect x="170" y="190" width="12" height="12" fill="#ffffff" stroke="#db2777" stroke-width="3.5"/>
  <rect x="330" y="190" width="12" height="12" fill="#ffffff" stroke="#db2777" stroke-width="3.5"/>
  <rect x="170" y="286" width="12" height="12" fill="#ffffff" stroke="#db2777" stroke-width="3.5"/>
  <rect x="330" y="286" width="12" height="12" fill="#ffffff" stroke="#db2777" stroke-width="3.5"/>
  <text x="256" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="800" fill="#faf5eb" text-anchor="middle">.svg</text>
</svg>
