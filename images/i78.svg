<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">Forest emerald C2PA provenance seal</title>
  <desc id="desc">White image framing brackets around a bold octagonal C2PA verification seal on deep forest green.</desc>
  <rect width="512" height="320" fill="#064e3b"/>
  <circle cx="256" cy="164" r="110" fill="none" stroke="#065f46" stroke-width="3"/>
  <circle cx="256" cy="164" r="145" fill="none" stroke="#065f46" stroke-width="2"/>

  <!-- Minimalist white photo corner brackets -->
  <g fill="none" stroke="#d1fae5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 64V36h28"/>
    <path d="M314 36h28v28"/>
    <path d="M170 256v28h28"/>
    <path d="M342 256v28h-28"/>
  </g>

  <!-- PNG micro-tag -->
  <rect x="226" y="26" width="60" height="24" rx="5" fill="#022c22" stroke="#34d399" stroke-width="2.5"/>
  <text x="256" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#6ee7b7" text-anchor="middle">PNG</text>

  <!-- Octagonal C2PA seal -->
  <polygon points="222,82 290,82 332,124 332,192 290,234 222,234 180,192 180,124" fill="#10b981" stroke="#ecfdf5" stroke-width="5" stroke-linejoin="round"/>
  <text x="256" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="800" fill="#022c22" text-anchor="middle">C2PA</text>
  <circle cx="256" cy="190" r="24" fill="#022c22"/>
  <path d="M244 190l8 8 17-17" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
