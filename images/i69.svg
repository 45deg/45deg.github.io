<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">HTML Packer</title>
  <desc id="desc">Compress HTML, MHTML, or folders into a single self-extracting HTML file.</desc>
  <rect width="512" height="320" fill="#f8fafc"/>

  <!-- Left: Folder + HTML files -->
  <g>
    <path d="M50 62a10 10 0 0 1 10-10h34l10 12h52a10 10 0 0 1 10 10v56a10 10 0 0 1-10 10H60a10 10 0 0 1-10-10V62z" fill="#fde68a" stroke="#b45309" stroke-width="4" stroke-linejoin="round"/>
    <rect x="82" y="94" width="102" height="114" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <rect x="96" y="110" width="74" height="30" rx="7" fill="#1e293b"/>
    <text x="133" y="131" font-family="monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">HTML</text>
    <rect x="96" y="156" width="74" height="10" rx="5" fill="#94a3b8"/>
    <rect x="96" y="176" width="54" height="10" rx="5" fill="#cbd5e1"/>
  </g>

  <!-- Center: gzip + Arrow -->
  <g>
    <rect x="208" y="72" width="76" height="34" rx="17" fill="#2563eb"/>
    <text x="246" y="95" font-family="monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">gzip</text>
    <path d="M206 136h76m-18-18 20 18-20 18" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Single packed .html file -->
  <g>
    <path d="M312 58a14 14 0 0 1 14-14h84l38 38v120a14 14 0 0 1-14 14H326a14 14 0 0 1-14-14V58z" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M410 44v30a8 8 0 0 0 8 8h30" fill="#cbd5e1" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <g transform="translate(346 76) scale(2.8)">
      <rect width="24" height="24" rx="6" fill="#0f172a"/>
      <path d="M7 8.5L12 5.5l5 3v7l-5 3-5-3v-7z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M7 8.5L12 11.5l5-3M12 11.5v7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <rect x="330" y="158" width="100" height="40" rx="10" fill="#047857"/>
    <text x="380" y="185" font-family="monospace" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">.html</text>
  </g>

  <!-- Title -->
  <text x="256" y="282" font-family="sans-serif" font-size="38" font-weight="800" fill="#0f172a" text-anchor="middle">HTML Packer</text>
</svg>
