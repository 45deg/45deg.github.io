<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">Cosmic sci-fi guidebook cover for Agentic AI</title>
  <desc id="desc">Deep cosmic indigo book cover with a glowing three-node agent loop, starfield dots, and JA badge.</desc>
  <rect width="512" height="320" fill="#1e1b4b"/>

  <!-- Subtle starfield across full width + center -->
  <g fill="#fde68a" opacity="0.75">
    <circle cx="48" cy="54" r="2.5"/><circle cx="96" cy="142" r="2"/><circle cx="66" cy="252" r="3"/>
    <circle cx="212" cy="48" r="2"/><circle cx="258" cy="72" r="2.5"/><circle cx="324" cy="256" r="2.5"/>
    <circle cx="216" cy="272" r="2"/><circle cx="418" cy="64" r="3"/><circle cx="462" cy="186" r="2"/><circle cx="408" cy="264" r="2.5"/>
  </g>

  <!-- Book spine accent -->
  <rect x="164" y="16" width="22" height="288" rx="4" fill="#312e81"/>
  <path d="M192 16v288" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- JA corner badge -->
  <rect x="296" y="28" width="48" height="28" rx="6" fill="#f43f5e"/>
  <text x="320" y="48" font-family="sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">JA</text>

  <!-- Glowing orbital 3-node agent loop -->
  <circle cx="268" cy="166" r="64" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-dasharray="6 6"/>
  <g fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 120c18 10 28 28 24 46"/>
    <path d="M303 160l7 8 8-6"/>
    <path d="M288 202c-16 8-34 8-48 0"/>
    <path d="M248 198l-9 4 4 9"/>
    <path d="M226 168c-2-18 8-36 24-46"/>
    <path d="M241 120l10 1-2 10"/>
  </g>
  <circle cx="268" cy="114" r="16" fill="#fbbf24"/>
  <circle cx="306" cy="184" r="16" fill="#2dd4bf"/>
  <circle cx="230" cy="184" r="16" fill="#f43f5e"/>
</svg>
