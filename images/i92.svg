<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">Split glitch landscape for repeated JPEG compression</title>
  <desc id="desc">Smooth landscape top half crushed into blocky discolored JPEG macroblocks across the bottom half.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- Top half (y=0..160): Smooth crisp landscape -->
  <rect width="512" height="160" fill="url(#sky)"/>
  <circle cx="294" cy="64" r="28" fill="#facc15"/>
  <path d="M0 160v-44c76-34 152-34 244-6s174 28 268-8v58z" fill="#16a34a"/>
  <path d="M0 160v-18c94-18 186-12 276 6s156 12 236-10v22z" fill="#15803d"/>

  <!-- Bottom half (y=160..320): Blocky JPEG macroblock grid -->
  <g>
    <!-- Row 1 y=160..192 -->
    <rect x="0" y="160" width="64" height="32" fill="#22c55e"/><rect x="64" y="160" width="48" height="32" fill="#4ade80"/><rect x="112" y="160" width="48" height="32" fill="#84cc16"/><rect x="160" y="160" width="32" height="32" fill="#16a34a"/><rect x="192" y="160" width="32" height="32" fill="#a3e635"/><rect x="224" y="160" width="32" height="32" fill="#15803d"/><rect x="256" y="160" width="32" height="32" fill="#facc15"/><rect x="288" y="160" width="32" height="32" fill="#bef264"/><rect x="320" y="160" width="32" height="32" fill="#22c55e"/><rect x="352" y="160" width="48" height="32" fill="#86efac"/><rect x="400" y="160" width="56" height="32" fill="#16a34a"/><rect x="456" y="160" width="56" height="32" fill="#4d7c0f"/>
    <!-- Row 2 y=192..224 -->
    <rect x="0" y="192" width="64" height="32" fill="#15803d"/><rect x="64" y="192" width="48" height="32" fill="#166534"/><rect x="112" y="192" width="48" height="32" fill="#65a30d"/><rect x="160" y="192" width="32" height="32" fill="#e879f9"/><rect x="192" y="192" width="32" height="32" fill="#15803d"/><rect x="224" y="192" width="32" height="32" fill="#4ade80"/><rect x="256" y="192" width="32" height="32" fill="#84cc16"/><rect x="288" y="192" width="32" height="32" fill="#fde047"/><rect x="320" y="192" width="32" height="32" fill="#166534"/><rect x="352" y="192" width="48" height="32" fill="#38bdf8"/><rect x="400" y="192" width="56" height="32" fill="#14532d"/><rect x="456" y="192" width="56" height="32" fill="#16a34a"/>
    <!-- Row 3 y=224..256 -->
    <rect x="0" y="224" width="64" height="32" fill="#166534"/><rect x="64" y="224" width="48" height="32" fill="#4d7c0f"/><rect x="112" y="224" width="48" height="32" fill="#14532d"/><rect x="160" y="224" width="32" height="32" fill="#16a34a"/><rect x="192" y="224" width="32" height="32" fill="#eab308"/><rect x="224" y="224" width="32" height="32" fill="#166534"/><rect x="256" y="224" width="32" height="32" fill="#15803d"/><rect x="288" y="224" width="32" height="32" fill="#4d7c0f"/><rect x="320" y="224" width="32" height="32" fill="#a3e635"/><rect x="352" y="224" width="48" height="32" fill="#14532d"/><rect x="400" y="224" width="56" height="32" fill="#15803d"/><rect x="456" y="224" width="56" height="32" fill="#166534"/>
    <!-- Row 4 y=256..288 -->
    <rect x="0" y="256" width="64" height="32" fill="#14532d"/><rect x="64" y="256" width="48" height="32" fill="#15803d"/><rect x="112" y="256" width="48" height="32" fill="#365314"/><rect x="160" y="256" width="32" height="32" fill="#14532d"/><rect x="192" y="256" width="32" height="32" fill="#166534"/><rect x="224" y="256" width="32" height="32" fill="#3f6212"/><rect x="256" y="256" width="32" height="32" fill="#f472b6"/><rect x="288" y="256" width="32" height="32" fill="#14532d"/><rect x="320" y="256" width="32" height="32" fill="#15803d"/><rect x="352" y="256" width="48" height="32" fill="#166534"/><rect x="400" y="256" width="56" height="32" fill="#365314"/><rect x="456" y="256" width="56" height="32" fill="#14532d"/>
    <!-- Row 5 y=288..320 -->
    <rect x="0" y="288" width="64" height="32" fill="#052e16"/><rect x="64" y="288" width="48" height="32" fill="#14532d"/><rect x="112" y="288" width="48" height="32" fill="#166534"/><rect x="160" y="288" width="32" height="32" fill="#14532d"/><rect x="192" y="288" width="32" height="32" fill="#052e16"/><rect x="224" y="288" width="32" height="32" fill="#14532d"/><rect x="256" y="288" width="32" height="32" fill="#166534"/><rect x="288" y="288" width="32" height="32" fill="#052e16"/><rect x="320" y="288" width="32" height="32" fill="#14532d"/><rect x="352" y="288" width="48" height="32" fill="#15803d"/><rect x="400" y="288" width="56" height="32" fill="#052e16"/><rect x="456" y="288" width="56" height="32" fill="#14532d"/>
  </g>

  <!-- Hard glitch seam + JPG tag -->
  <path d="M0 160h512" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="172" y="264" width="56" height="28" rx="4" fill="#09090b" fill-opacity="0.82"/>
  <text x="200" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">JPG</text>
</svg>
