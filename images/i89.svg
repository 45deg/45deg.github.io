<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">ISOBMFF MP4 container atom bento blocks</title>
  <desc id="desc">Stacked flat color-coded MP4 container boxes ftyp, moov, and mdat with a play icon.</desc>
  <rect width="512" height="320" fill="#1e1b4b"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800">
    <!-- ftyp atom -->
    <rect x="168" y="26" width="176" height="58" rx="10" fill="#f59e0b"/>
    <text x="256" y="64" font-size="26" fill="#1e1b4b" text-anchor="middle">ftyp</text>

    <!-- moov atom -->
    <rect x="168" y="92" width="176" height="62" rx="10" fill="#38bdf8"/>
    <text x="256" y="132" font-size="26" fill="#082f49" text-anchor="middle">moov</text>

    <!-- mdat atom -->
    <rect x="168" y="162" width="176" height="132" rx="12" fill="#f43f5e"/>
    <text x="184" y="190" font-size="19" fill="#ffe4e6">mdat</text>
    <circle cx="256" cy="228" r="26" fill="#ffffff"/>
    <path d="M248 214l22 14-22 14z" fill="#f43f5e"/>
    <text x="328" y="279" font-size="20" fill="#ffffff" text-anchor="end">.mp4</text>
  </g>
</svg>
